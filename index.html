<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إطعام منصة لمحاربة التبذير</title>

    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

    <!-- حقن تنسيقات متقدمة تتجاوز الـ Shadow DOM -->
    <style>
      /* تعديل ألوان وحجم واجهة n8n عبر المتغيرات البرمجية الخاصة به */
      :root {
        --chat--color-primary: #16a34a !important;
        --chat--color-primary-shade-50: #15803d !important;
        --chat--color-white: #ffffff !important;
        --chat--color-light: #f8fafc !important;
        --chat--color-dark: #0f172a !important;
        --chat--border-radius: 20px !important;
        --chat--window--width: 420px !important;
        --chat--window--height: 620px !important;
        --chat--header--background: #ffffff !important;
        --chat--header--color: #0f172a !important;
      }

      /* جعل مربع الإدخال والرسائل تبدو مثل ChatGPT / Gemini */
      n8n-chat, .n8n-chat {
        font-family: system-ui, -apple-system, sans-serif !important;
        direction: rtl !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script type="module">
  import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

  createChat({
    webhookUrl: 'https://yacinefadel.app.n8n.cloud/webhook/59a5c61a-52b7-4931-8b2a-2e0a56ee953a/chat',
    i18n: {
      en: {
        title: 'مساعد إطعام الذكي 🌿',
        subtitle: 'نحن هنا لمساعدتك في التبرع أو الوصول إلى المساعدات',
        inputPlaceholder: 'اكتب سؤالك هنا...',
      },
    },
    initialMessages: [
      'أهلاً بك في منصة إطعام للحد من الهدر الغذائي! 🌾',
      'كيف يمكنني مساعدتك اليوم؟'
    ],
  });
</script>
  </body>
</html>
